<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWIDY SHOP - Pusat Top Up & PPOB Terlengkap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://app.midtrans.com/snap/snap.js" data-client-key="CLIENT_KEY_KAMU"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.25s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-24 selection:bg-blue-600 selection:text-white" onload="loadBrands()">

    <header class="bg-blue-600 text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button id="btnBack" class="hidden text-white hover:text-blue-200 transition" onclick="switchView('catalog')">
                    <i class="fas fa-arrow-left text-lg"></i>
                </button>
                <h1 class="text-xl font-extrabold tracking-wide">TWIDY<span class="text-yellow-300">SHOP</span></h1>
            </div>
            <span class="text-xs bg-blue-700 px-2.5 py-1 rounded-full font-medium text-blue-100"><i class="fas fa-circle text-emerald-400 text-[8px] mr-1"></i> Otomatis 24 Jam</span>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 mt-4">
        
        <!-- KATALOG -->
        <div id="viewCatalog" class="fade-in block">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-5 text-white shadow-lg mb-5 relative overflow-hidden">
                <div class="relative z-10">
                    <span class="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">Resmi & Legal</span>
                    <h2 class="text-lg font-bold mt-1">Transaksi Tanpa Ribet</h2>
                    <p class="text-xs text-blue-100 mt-0.5">Pulsa, Token, E-Wallet, & Game Instant Masuk.</p>
                </div>
                <i class="fas fa-bolt absolute -right-3 -bottom-4 text-7xl text-white/10"></i>
            </div>

            <div class="mb-6">
                <h3 class="font-bold text-slate-800 mb-3 text-sm flex items-center gap-2"><i class="fas fa-layer-group text-blue-500"></i> Daftar Produk Digiflazz</h3>
                <!-- Tempat semua brand/produk dari akun Digiflazz muncul otomatis -->
                <div id="dynamicBrandContainer" class="grid grid-cols-2 gap-3">
                    <div class="col-span-2 text-center text-xs text-slate-400 py-6"><i class="fas fa-spinner fa-spin mr-1"></i> Menyinkronkan produk dari akun Digiflazz...</div>
                </div>
            </div>
        </div>

        <!-- FORM CHECKOUT -->
        <div id="viewCheckout" class="hidden fade-in">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-4 flex items-center gap-3">
                <div class="w-12 h-12 rounded-lg bg-blue-600 text-white flex items-center justify-center text-xl"><i class="fas fa-cart-shopping"></i></div>
                <div>
                    <h2 id="checkoutTitle" class="font-bold text-slate-800 text-sm">Nama Produk</h2>
                    <p class="text-[10px] text-emerald-600 font-medium"><i class="fas fa-check-circle"></i> Proses Otomatis via API</p>
                </div>
            </div>

            <form id="formCheckout">
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-4">
                    <label id="inputLabelText" class="block text-xs font-bold text-slate-700 mb-2">Masukkan User ID / Nomor Tujuan</label>
                    <input type="text" id="targetId" required placeholder="Contoh: 08123456789 atau ID Game" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2.5 text-xs text-slate-800 outline-none focus:border-blue-600">
                </div>

                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6">
                    <label class="block text-xs font-bold text-slate-700 mb-2">Pilih Nominal Produk</label>
                    <div class="grid grid-cols-2 gap-2 max-h-[300px] overflow-y-auto no-scrollbar" id="nominalOptions">
                    </div>
                </div>

                <button type="submit" id="btnPay" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-600/20 text-xs transition disabled:bg-slate-400">
                    Lanjut Pembayaran (Midtrans)
                </button>
            </form>
        </div>
    </main>

    <!-- Bottom Nav -->
    <div class="fixed bottom-0 w-full bg-white border-t border-slate-200 z-40">
        <div class="max-w-md mx-auto flex justify-around p-2 text-slate-400">
            <button onclick="switchView('catalog')" class="flex flex-col items-center text-blue-600">
                <i class="fas fa-house text-base"></i>
                <span class="text-[9px] font-bold mt-0.5">Beranda</span>
            </button>
            <div onclick="alert('Fitur Cek Status segera hadir!')" class="flex flex-col items-center hover:text-blue-600 cursor-pointer">
                <i class="fas fa-receipt text-base"></i>
                <span class="text-[9px] font-bold mt-0.5">Cek Status</span>
            </div>
            <div onclick="alert('Hubungi Admin via WhatsApp untuk bantuan.')" class="flex flex-col items-center hover:text-blue-600 cursor-pointer">
                <i class="fas fa-headset text-base"></i>
                <span class="text-[9px] font-bold mt-0.5">Bantuan</span>
            </div>
        </div>
    </div>

    <script>
        async function loadBrands() {
            try {
                const res = await fetch('/api/get-products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get_all_brands' })
                });
                const brands = await res.json();
                const container = document.getElementById('dynamicBrandContainer');

                if (Array.isArray(brands) && brands.length > 0) {
                    container.innerHTML = brands.map(b => `
                        <div onclick="openCheckout('${b}', '${b}')" class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm cursor-pointer hover:border-blue-500 flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center"><i class="fas fa-bolt"></i></div>
                            <div>
                                <p class="text-xs font-bold text-slate-800 truncate">${b}</p>
                                <p class="text-[10px] text-slate-400">Tersedia via API</p>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = `<div class="col-span-2 text-center text-xs text-red-500">Tidak ada produk aktif di Digiflazz.</div>`;
                }
            } catch (e) {
                console.error(e);
            }
        }

        function switchView(view) {
            if(view === 'catalog') {
                document.getElementById('viewCatalog').classList.remove('hidden');
                document.getElementById('viewCheckout').classList.add('hidden');
                document.getElementById('btnBack').classList.add('hidden');
                window.scrollTo(0,0);
            }
        }

        async function openCheckout(title, brandName) {
            document.getElementById('viewCatalog').classList.add('hidden');
            document.getElementById('viewCheckout').classList.remove('hidden');
            document.getElementById('btnBack').classList.remove('hidden');
            
            document.getElementById('checkoutTitle').innerText = title;
            
            const container = document.getElementById('nominalOptions');
            const btnPay = document.getElementById('btnPay');
            btnPay.disabled = true;

            container.innerHTML = `<div class="col-span-2 text-center text-xs text-slate-500 py-6"><i class="fas fa-spinner fa-spin mr-2 text-lg"></i> Mengambil produk...</div>`;
            window.scrollTo(0,0);

            try {
                const res = await fetch('/api/get-products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get_products', brand: brandName })
                });
                const products = await res.json();

                if (products.length > 0) {
                    container.innerHTML = products.map(p => `
                        <label class="border border-slate-200 p-2.5 rounded-lg cursor-pointer hover:border-blue-600 flex flex-col">
                            <input type="radio" name="nominal" value="${p.sku}" data-price="${p.price}" required class="mb-1">
                            <span class="text-[11px] font-bold text-slate-800 mt-1 truncate" title="${p.name}">${p.name}</span>
                            <span class="text-[10px] text-blue-600">Rp ${p.price.toLocaleString('id-ID')}</span>
                        </label>
                    `).join('');
                    btnPay.disabled = false;
                } else {
                    container.innerHTML = `<div class="col-span-2 text-center text-xs text-red-500 font-bold py-6">Produk Kosong</div>`;
                }
            } catch (e) {
                container.innerHTML = `<div class="col-span-2 text-center text-xs text-red-500 py-6">Gagal memuat produk.</div>`;
            }
        }

        document.getElementById('formCheckout').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const targetId = document.getElementById('targetId').value;
            const selectedNomor = document.querySelector('input[name="nominal"]:checked');
            const btnPay = document.getElementById('btnPay');

            if (!selectedNomor) {
                alert("Pilih nominal produk terlebih dahulu!");
                return;
            }

            const productCode = selectedNomor.value;
            const price = selectedNomor.getAttribute('data-price');
            const originalText = btnPay.innerHTML;

            btnPay.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Menyiapkan Pembayaran...';
            btnPay.disabled = true;

            try {
                const response = await fetch('/api/create-transaction', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ targetId, productCode, price }) 
                });

                const data = await response.json();

                if (response.ok && data.token) {
                    window.snap.pay(data.token, {
                        onSuccess: function(result){ alert("Pembayaran Berhasil! Pesanan diproses otomatis."); console.log(result);},
                        onPending: function(result){ alert("Menunggu pembayaran Anda."); console.log(result);},
                        onError: function(result){ alert("Pembayaran Gagal!"); console.log(result);},
                        onClose: function(){ alert("Popup pembayaran ditutup."); }
                    });
                } else {
                    alert("Error Midtrans: " + JSON.stringify(data.error || data.message));
                }
            } catch (error) {
                console.error(error);
                alert("Gagal terhubung ke server backend Vercel.");
            } finally {
                btnPay.innerHTML = originalText;
                btnPay.disabled = false;
            }
        });
    </script>
</body>
</html>
