<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWIDY SHOP - Top Up & PPOB Otomatis</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Midtrans Snap Production CDN (Ganti CLIENT_KEY_KAMU dengan Client Key Live Midtrans-mu) -->
    <script src="https://app.midtrans.com/snap/snap.js" data-client-key="CLIENT_KEY_KAMU"></script>
</head>
<body class="bg-gray-100 font-sans pb-16">

    <!-- Header -->
    <div class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wider">TWIDY SHOP</h1>
        <span class="text-xs bg-emerald-500 text-white px-2 py-1 rounded-full font-medium"><i class="fa-solid fa-circle text-[8px] mr-1"></i>Otomatis 24 Jam</span>
    </div>

    <!-- Main Container -->
    <div class="max-w-md mx-auto p-4">
        
        <!-- Form Transaksi -->
        <div class="bg-white rounded-xl shadow-sm p-5 mt-4">
            <h2 class="text-base font-bold text-gray-800 mb-3 border-b pb-2">Form Transaksi Otomatis</h2>
            
            <form id="formCheckout">
                <!-- Input Tujuan -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Masukkan Nomor HP / ID Tujuan</label>
                    <input type="text" id="targetId" required placeholder="Contoh: 08123456789 atau ID Game" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>

                <!-- Pilihan Nominal -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Pilih Nominal Produk</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="border rounded-lg p-3 flex flex-col cursor-pointer hover:border-blue-500 transition">
                            <input type="radio" name="nominal" value="ml100" class="mb-1" required>
                            <span class="text-sm font-semibold">Nominal 10.000</span>
                            <span class="text-xs text-gray-500">Rp 10.000</span>
                        </label>
                        <label class="border rounded-lg p-3 flex flex-col cursor-pointer hover:border-blue-500 transition">
                            <input type="radio" name="nominal" value="ml500" class="mb-1" required>
                            <span class="text-sm font-semibold">Nominal 50.000</span>
                            <span class="text-xs text-gray-500">Rp 50.000</span>
                        </label>
                    </div>
                </div>

                <!-- Tombol Submit -->
                <button type="submit" id="btnPay" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-lg text-sm">
                    Lanjut Pembayaran (Midtrans)
                </button>
            </form>
        </div>

    </div>

    <!-- Script Koneksi Frontend ke Backend Vercel & Midtrans Snap -->
    <script>
    document.getElementById('formCheckout').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const targetId = document.getElementById('targetId').value;
        const selectedNomor = document.querySelector('input[name="nominal"]:checked');
        const btnPay = document.getElementById('btnPay');

        if (!selectedNomor) {
            alert("Pilih nominal produk terlebih dahulu!");
            return;
        }

        const productCode = selectedNomor.value;
        const originalText = btnPay.innerHTML;

        btnPay.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Menyiapkan Pembayaran...';
        btnPay.disabled = true;

        try {
            const response = await fetch('/api/create-transaction', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ targetId, productCode })
            });

            const data = await response.json();

            if (response.ok && data.token) {
                // Munculkan popup pembayaran Midtrans Live Production
                window.snap.pay(data.token, {
                    onSuccess: function(result){ 
                        alert("Pembayaran Berhasil! Pesanan sedang diproses otomatis ke Digiflazz."); 
                        console.log(result); 
                    },
                    onPending: function(result){ 
                        alert("Menunggu pembayaran Anda."); 
                        console.log(result); 
                    },
                    onError: function(result){ 
                        alert("Pembayaran Gagal!"); 
                        console.log(result); 
                    },
                    onClose: function(){ 
                        alert("Popup pembayaran ditutup."); 
                    }
                });
            } else {
                alert("Gagal: " + (data.message || 'Terjadi kesalahan sistem'));
            }
        } catch (error) {
            console.error(error);
            alert("Gagal terhubung ke server backend Vercel.");
        } finally {
            btnPay.innerHTML = originalText;
            btnPay.disabled = false;
        }
    });
    </script>
</body>
</html>
